<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Anniversary</title>
  <meta name="theme-color" content="#e11d48">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fecdd3, #fda4af);
      font-family: Georgia, serif;
      text-align: center;
    }
    button.title {
      font-family: inherit;
      font-size: clamp(2rem, 8vw, 4rem);
      color: #fff;
      background: #e11d48;
      border: none;
      border-radius: 1rem;
      padding: 1.5rem 2.5rem;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(225, 29, 72, 0.4);
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 50% { transform: scale(1.06); } }
    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.5);
      padding: 1rem;
    }
    .overlay.open { display: flex; }
    .card {
      background: #fff;
      border-radius: 1rem;
      padding: 2rem;
      max-width: 32rem;
      max-height: 85vh;
      overflow-y: auto;
      color: #333;
      font-size: 1.2rem;
      line-height: 1.6;
      white-space: pre-line;
    }
    .card button {
      margin-top: 1.5rem;
      font-family: inherit;
      font-size: 1rem;
      padding: 0.5rem 1.5rem;
      border: none;
      border-radius: 0.5rem;
      background: #e11d48;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button class="title" id="open">💖 Happy Anniversary 💖</button>

  <div class="overlay" id="overlay">
    <div class="card">
      <div id="message"></div>
      <button id="close">Close</button>
    </div>
  </div>

  <script>
    // >>> Replace the text below with your anniversary message <<<
    const MESSAGE = "YOUR MESSAGE GOES HERE";

    const overlay = document.getElementById("overlay");
    document.getElementById("message").textContent = MESSAGE;
    document.getElementById("open").onclick = () => overlay.classList.add("open");
    document.getElementById("close").onclick = () => overlay.classList.remove("open");

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
